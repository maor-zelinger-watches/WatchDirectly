<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com https://oauth2.googleapis.com">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Page Not Found — How You Watch</title>
  <meta name="description" content="This page doesn't exist. Head back to the How You Watch feed.">
  <meta name="robots" content="noindex">

  <!-- GitHub Pages serves this page for ANY missing path under the site,
       including nested ones (/foo/bar), so every URL here must be absolute
       from the domain root — relative paths would resolve against the
       missing URL's directory and break. Rooted at "/" because the site is
       served from the domain root on the custom domain; under the old
       github.io/WatchDirectly subpath these must be "/". -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header" id="header">
    <div class="header__inner">
      <div class="header__logo">
        <span class="header__logo-icon">⌚</span>
        <a href="/" class="header__title-link"><h1 class="header__title">How You Watch</h1></a>
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main">
    <article class="error-page">
      <p class="error-page__code">404</p>
      <h2 class="error-page__title">Page not found</h2>
      <p class="error-page__text">This page doesn't exist — maybe the link is old, or maybe it never was. The feed is still ticking, though.</p>
      <a href="/" class="btn btn--primary">Back to the feed</a>
    </article>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer" id="footer">
    <div class="footer__inner">
      <nav class="footer__nav" id="footer-nav">
        <a href="/terms.html" class="footer__nav-link">Terms</a>
        <a href="/privacy.html" class="footer__nav-link">Privacy</a>
      </nav>
      <div class="footer__meta">
        <span class="footer__copyright">© <span id="footer-year">2026</span> How You Watch</span>
      </div>
    </div>
  </footer>
  <script src="/js/footer-year.js"></script>

</body>
</html>
