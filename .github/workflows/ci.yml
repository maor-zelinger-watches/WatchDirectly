name: CI

# Unit + e2e run on every push and PR (fast, hermetic — no live backend).
# Smoke + perf hit the live site, so they run on a schedule / on demand only,
# never per-push, to avoid hammering the Apps Script backend.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * *' # daily, 09:17 UTC — smoke + perf against production
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-e2e:
    name: unit + e2e
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # CI is set by GitHub — this activates playwright.config.js's forbidOnly,
      # retries, and single-worker settings.
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  smoke-perf:
    name: smoke + perf (live)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: npm run test:perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-live
          path: playwright-report/
          retention-days: 7
